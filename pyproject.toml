[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rain-pipeline"
dynamic = ["version"]
description = "Evidence-first research pipeline: exploration, write-once registration, git-anchored holdouts, measurement, independent evaluation, verification and replay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Anna engine (in-process) on an embedded PostgreSQL + pgvector
  "pgserver>=0.1.4",
  "psycopg2-binary>=2.9",
  "httpx>=0.23",
  # R.A.I.N. experiment contracts
  "jsonschema>=4.26,<5",
  # DRR runtime subset (DRR itself is installed editable from vendor/, without its notebook extras)
  "numpy",
  "scipy",
  "pandas",
  "scikit-learn",
  "networkx",
  "pyinform",
  "PyYAML",
  "matplotlib",
  "seaborn",
  # PhysioNet byte-range fetches
  "requests",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rain-pipeline = "rain_pipeline.__main__:main"

[tool.setuptools]
packages = ["rain_pipeline"]

[tool.setuptools.dynamic]
version = {attr = "rain_pipeline.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vendor"]

[tool.ruff.lint]
# Syntax errors and pyflakes (undefined names, unused imports and variables): the dead-code gate.
select = ["E9", "F"]
